<!-- Warm-up Splash -->
<div class="splash-screen" *ngIf="!isBackendReady">
  <div class="splash-content">
    <span class="splash-icon">⬡</span>
    <h2 class="splash-title">RateLimiter</h2>
    <p class="splash-msg">Warming up the server, hang tight...</p>
    <p class="splash-submsg">⚡ Hosted on Render's free tier — first load takes ~50-60s</p>
    <div class="splash-spinner"></div>
    <!-- <span class="splash-timer">{{ waitSeconds }}s elapsed</span> -->
  </div>
</div>

<!-- App Shell -->
<div class="app-shell" *ngIf="isBackendReady">
  <aside class="sidebar">
    <div class="logo">
      <span class="logo-icon">⬡</span>
      <span class="logo-text">RateLimiter</span>
    </div>
    <nav class="nav">
      <a routerLink="/dashboard" routerLinkActive="active" class="nav-link">
        <span class="nav-icon">📊</span>
        <span class="nav-label">Dashboard</span>
      </a>
      <a routerLink="/config" routerLinkActive="active" class="nav-link">
        <span class="nav-icon">⚙️</span>
        <span class="nav-label">Config</span>
      </a>
      <a routerLink="/tester" routerLinkActive="active" class="nav-link">
        <span class="nav-icon">🚀</span>
        <span class="nav-label">Tester</span>
      </a>
    </nav>
    <div class="sidebar-bottom">
      <div class="env-badge">
        <span class="status-dot enabled"></span>
        DEVELOPMENT
      </div>
      <div class="redis-status">
        <span class="status-dot enabled"></span>
        Redis OK
      </div>
    </div>
  </aside>
  <main class="main-content">
    <router-outlet></router-outlet>
  </main>
</div>
