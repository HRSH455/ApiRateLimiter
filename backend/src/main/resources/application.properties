spring.application.name=RateLimiter
server.port=${PORT:8080}
server.address=0.0.0.0

# Redis
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}

# Trusted reverse proxy IPs — X-Forwarded-For is ONLY trusted from these IPs.
# Set to your nginx/load-balancer IP(s) in production. Comma-separated.
rate-limit.trusted-proxies=${TRUSTED_PROXIES:}

# Admin credentials — HTTP Basic auth on /admin/**
admin.username=${ADMIN_USERNAME}
admin.password=${ADMIN_PASSWORD}

# Rate Limit Routes — strategy must match: fixed, sliding, token
rate-limit.routes[0].path=/api/auth/login
rate-limit.routes[0].limit=5
rate-limit.routes[0].windowSecs=900
rate-limit.routes[0].strategy=fixed
rate-limit.routes[0].keyPrefix=auth

rate-limit.routes[1].path=/api/search
rate-limit.routes[1].limit=30
rate-limit.routes[1].windowSecs=60
rate-limit.routes[1].strategy=sliding
rate-limit.routes[1].keyPrefix=search

rate-limit.routes[2].path=/api/upload
rate-limit.routes[2].limit=10
rate-limit.routes[2].windowSecs=3600
rate-limit.routes[2].strategy=fixed
rate-limit.routes[2].keyPrefix=upload

rate-limit.routes[3].path=/api/public
rate-limit.routes[3].limit=100
rate-limit.routes[3].windowSecs=60
rate-limit.routes[3].strategy=fixed
rate-limit.routes[3].keyPrefix=public

rate-limit.routes[4].path=/api/user
rate-limit.routes[4].limit=10
rate-limit.routes[4].windowSecs=60
rate-limit.routes[4].strategy=fixed
rate-limit.routes[4].keyPrefix=user

rate-limit.routes[5].path=/api/admin
rate-limit.routes[5].limit=5
rate-limit.routes[5].windowSecs=60
rate-limit.routes[5].strategy=sliding
rate-limit.routes[5].keyPrefix=admin